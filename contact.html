<body>
    <header>
        <div class="wrap">
            <a href="index.html" class="brand">Amber Julie Nez</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="content.html">Content</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="contact" class="wrap">
            <div class="container">
                <div class="box">
                    <span class="eyebrow">Contact</span>
                    <h1>Let's connect.</h1>
                    <p>Got a project, an idea, or just want to say hi? Send a message and I'll get back to you.</p>
                    <form id="contact-form" action="https://formspree.io/f/mppwbjly" method="POST">
                        <div class="form-row">
                            <input type="text" name="name" id="name" placeholder="Name" autocomplete="name" required>
                            <input type="email" name="email" id="email" placeholder="Email" autocomplete="email" required>
                        </div>
                        <textarea name="message" id="message" placeholder="What's up?" rows="5" required></textarea>
                        <input type="text" name="_gotcha" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">
                        <button type="submit" class="btn">Send Message</button>
                        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="wrap">
            <div class="social-media-links">
                <a href="https://www.linkedin.com/in/amberjnez" target="_blank" rel="noopener noreferrer" class="icon-link icon-linkedin" aria-label="LinkedIn"></a>
                <a href="https://www.instagram.com/amberrrjulie" target="_blank" rel="noopener noreferrer" class="icon-link icon-instagram" aria-label="Instagram"></a>
                <a href="https://www.tiktok.com/@amberrrjulie" target="_blank" rel="noopener noreferrer" class="icon-link icon-tiktok" aria-label="TikTok"></a>
                <a href="https://www.youtube.com/@amberrrjulie" target="_blank" rel="noopener noreferrer" class="icon-link icon-youtube" aria-label="YouTube"></a>
            </div>
        </div>
    </footer>
